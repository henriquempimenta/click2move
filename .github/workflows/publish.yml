name: Publish Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      factorio_versions: ${{ steps.targets.outputs.factorio_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2 python3 jq

      - name: Check Lua syntax, regression tests, and packaging
        run: python3 tools/check.py

      - name: Build every game version before uploading any
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/package.py --expected-version "${RELEASE_TAG#v}"

      - name: List game versions
        id: targets
        run: echo "factorio_versions=$(jq -c '.factorio_versions' targets.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: Portal
    strategy:
      # One upload at a time; a failed game version can be re-run without repeating the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        factorio_version: ${{ fromJSON(needs.check.outputs.factorio_versions) }}
    name: publish (Factorio ${{ matrix.factorio_version }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and verify release archive
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FACTORIO_VERSION: ${{ matrix.factorio_version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ZIP_FILE=$(python3 tools/package.py --expected-version "$VERSION" --target "$FACTORIO_VERSION")
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "mod_name=$(jq -r '.name' info.json)" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: existing
        env:
          MOD_NAME: ${{ steps.package.outputs.mod_name }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
        run: |
          set -euo pipefail
          # A re-run must not upload twice: an identical published ZIP counts as done, a different one is a conflict.
          VERSION=$(basename "$ZIP_FILE" .zip)
          VERSION=${VERSION#"${MOD_NAME}_"}
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            "https://mods.factorio.com/api/mods/$MOD_NAME/full")
          if [ "$HTTP_CODE" = 404 ]; then
            PUBLISHED_SHA1=""
          elif [ "$HTTP_CODE" = 200 ]; then
            PUBLISHED_SHA1=$(jq -er --arg version "$VERSION" '
              if (.releases | type) != "array" then error("missing release list") else . end
              | [.releases[] | select(.version == $version)]
              | if length == 0 then "" elif length == 1 and (.[0].sha1 | type) == "string" then .[0].sha1
                else error("unexpected release record") end' "$BODY_FILE")
          else
            echo "Release lookup failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          LOCAL_SHA1=$(sha1sum "$ZIP_FILE" | cut -d ' ' -f 1)
          if [ -z "$PUBLISHED_SHA1" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISHED_SHA1" = "$LOCAL_SHA1" ]; then
            echo "Version $VERSION is already published with identical contents; skipping upload."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is already published with different contents (portal SHA-1 $PUBLISHED_SHA1, built $LOCAL_SHA1)." >&2
            echo "Release a new version instead of replacing a published one." >&2
            exit 1
          fi

      - name: Initialize upload
        if: steps.existing.outputs.published == 'false'
        id: init
        env:
          API_KEY: ${{ secrets.API_KEY }}
          MOD_NAME: ${{ steps.package.outputs.mod_name }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "$API_KEY" ]; then
            echo "Configure API_KEY in the Portal environment before publishing." >&2
            exit 1
          fi
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST 'https://mods.factorio.com/api/v2/mods/releases/init_upload' \
            --header "Authorization: Bearer $API_KEY" --form "mod=$MOD_NAME")
          if [ "$HTTP_CODE" != 200 ] && [ "$HTTP_CODE" != 201 ]; then
            echo "Upload initialization failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          UPLOAD_URL=$(jq -er '.upload_url | select(type == "string" and startswith("https://"))' "$BODY_FILE")
          if [[ "$UPLOAD_URL" == *$'\n'* || "$UPLOAD_URL" == *$'\r'* ]]; then
            echo "Invalid upload URL returned by the portal." >&2
            exit 1
          fi
          MASK_VALUE=${UPLOAD_URL//'%'/'%25'}
          echo "::add-mask::$MASK_VALUE"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload and finish release
        if: steps.existing.outputs.published == 'false'
        env:
          UPLOAD_URL: ${{ steps.init.outputs.upload_url }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set +x
          set -euo pipefail
          test -f "$ZIP_FILE"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST "$UPLOAD_URL" --form "file=@$ZIP_FILE" --form "source_url=$SOURCE_URL")
          if [ "$HTTP_CODE" != 200 ] && [ "$HTTP_CODE" != 201 ]; then
            echo "Release upload failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          if ! jq -e '.success == true' "$BODY_FILE" > /dev/null 2>&1; then
            echo "The portal did not confirm a successful release upload." >&2
            exit 1
          fi
          echo "Release uploaded successfully."
