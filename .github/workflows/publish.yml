name: Publish Mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2 python3 jq

      - name: Check Lua syntax, regression tests, and packaging
        run: python3 tools/check.py

      - name: Build and verify release archive
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ZIP_FILE=$(python3 tools/package.py --expected-version "$VERSION")
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "mod_name=$(jq -r '.name' info.json)" >> "$GITHUB_OUTPUT"

      - name: Initialize upload
        id: init
        env:
          API_KEY: ${{ secrets.API_KEY }}
          MOD_NAME: ${{ steps.package.outputs.mod_name }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "$API_KEY" ]; then
            echo "Configure API_KEY in the Portal environment before publishing." >&2
            exit 1
          fi
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST 'https://mods.factorio.com/api/v2/mods/releases/init_upload' \
            --header "Authorization: Bearer $API_KEY" --form "mod=$MOD_NAME")
          if [ "$HTTP_CODE" != 200 ] && [ "$HTTP_CODE" != 201 ]; then
            echo "Upload initialization failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          UPLOAD_URL=$(jq -er '.upload_url | select(type == "string" and startswith("https://"))' "$BODY_FILE")
          if [[ "$UPLOAD_URL" == *$'\n'* || "$UPLOAD_URL" == *$'\r'* ]]; then
            echo "Invalid upload URL returned by the portal." >&2
            exit 1
          fi
          MASK_VALUE=${UPLOAD_URL//'%'/'%25'}
          echo "::add-mask::$MASK_VALUE"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload and finish release
        env:
          UPLOAD_URL: ${{ steps.init.outputs.upload_url }}
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set +x
          set -euo pipefail
          test -f "$ZIP_FILE"
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --request POST "$UPLOAD_URL" --form "file=@$ZIP_FILE" --form "source_url=$SOURCE_URL")
          if [ "$HTTP_CODE" != 200 ] && [ "$HTTP_CODE" != 201 ]; then
            echo "Release upload failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          if ! jq -e '.success == true' "$BODY_FILE" > /dev/null 2>&1; then
            echo "The portal did not confirm a successful release upload." >&2
            exit 1
          fi
          echo "Release uploaded successfully."
