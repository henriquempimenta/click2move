[mod-setting-description]
c2m-debug-mode=Enable debug messages in the chat.
c2m-debug-path=When debug mode is enabled, show path request and result messages.
c2m-debug-queue=When debug mode is enabled, show queue and cancel messages.
c2m-debug-stuck=When debug mode is enabled, show stuck detection and recovery messages.
c2m-debug-vehicle=When debug mode is enabled, show vehicle steering and recovery messages.
c2m-debug-margins=Draw the requested margin in cyan and the vehicle's usable smoothing allowance in orange around the yellow path. These are centerline deviation limits, not obstacle outlines. Independent of Debug Mode.
c2m-debug-curve=Draw the actual vehicle steering reference in magenta, with an on-path color legend. Independent of Debug Mode.
c2m-debug-bezier=Draw an experimental cubic Bézier vehicle reference in green inside the usable smoothing allowance. It joins straight legs with zero endpoint curvature and never controls movement. This local preview does not optimize driving time. Magenta remains the actual steering reference. Independent of Debug Mode; combine with Preview Without Moving to compare stationary routes.
c2m-debug-preview=Calculate and display routes without walking, driving or commanding spidertron autopilot. Changing a margin recalculates preview routes. Turning this off leaves existing previews paused; click a fresh destination to move. Independent of Debug Mode.
c2m-character-margin=Enlarges the character bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 0.45]
c2m-update-interval=Ticks between movement updates. Lower is smoother but uses more UPS. [Default: 1]
c2m-character-proximity-threshold=How close the character needs to be to a waypoint to consider it reached. [Default: 1.5]
c2m-vehicle-proximity-threshold=How close a vehicle needs to be to a waypoint to consider it reached. [Default: 6.0]
c2m-stuck-threshold=Game ticks without movement before straight-line recovery. Path following allows twice this duration without progress before recovery. [Default: 30]
c2m-vehicle-path-margin=Enlarges the vehicle bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 2.0]
c2m-vehicle-prefer-straight-paths=Ask Factorio's pathfinder to prefer straighter paths for vehicles. This can produce smoother driving routes, but may make paths slower to compute. [Default: false]
c2m-disable-on-arrival=Turn Click2Move mode off after reaching the last queued destination. Cancelled or failed routes leave the mode on. [Default: false]

