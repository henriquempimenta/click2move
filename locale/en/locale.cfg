[c2m-gui]
strategy-title=Routing Strategy
strategy-naive=Naive
strategy-belt-aware=Belt-aware
strategy-dual-phase=Dual-phase
strategy-changed=Click2Move: routing strategy set to __1__. Takes effect on your next move.
strategy-write-failed=Click2Move: could not change the routing strategy setting. Set it from Settings > Mod settings > Per player instead.
strategy-naive-tooltip=Walk the pathfinder's route as-is. Transport belts are ignored, so walking against one drags you backwards. This is the original behaviour.
strategy-belt-aware-tooltip=Account for belts: step off one that opposes you, and ride one going your way when it is genuinely faster. Chosen as soon as the route is found.
strategy-dual-phase-tooltip=Start walking immediately on the belt-aware route, while a better belt-graph route is computed in the background. It is swapped in only if it is still faster from wherever you have walked to by then.
