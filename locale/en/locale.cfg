[mod-setting-description]
c2m-debug-mode=Enable debug messages in the chat.
c2m-debug-path=When debug mode is enabled, show path request and result messages.
c2m-debug-queue=When debug mode is enabled, show queue and cancel messages.
c2m-debug-stuck=When debug mode is enabled, show stuck detection and recovery messages.
c2m-debug-vehicle=When debug mode is enabled, show vehicle steering and recovery messages.
c2m-character-margin=Enlarges the character bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 0.45]
c2m-update-interval=Ticks between movement updates. Lower is smoother but uses more UPS. [Default: 1]
c2m-character-proximity-threshold=How close the character needs to be to a waypoint to consider it reached. [Default: 1.5]
c2m-vehicle-proximity-threshold=How close a vehicle needs to be to a waypoint to consider it reached. [Default: 6.0]
c2m-stuck-threshold=Ticks to wait before considering the character stuck and repathing. [Default: 30]
c2m-vehicle-path-margin=Enlarges the vehicle bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 2.0]
c2m-vehicle-prefer-straight-paths=Ask Factorio's pathfinder to prefer straighter paths for vehicles. This can produce smoother driving routes, but may make paths slower to compute. [Default: false]

