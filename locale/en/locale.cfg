[mod-setting-description]
c2m-enable-debug-interface=Expose the click2move-debug remote interface used by automated benchmarks. Leave disabled during normal play. Requires a restart when changed. [Default: false]
c2m-debug-mode=Enable debug messages in the chat.
c2m-debug-path=When debug mode is enabled, show path request and result messages.
c2m-debug-queue=When debug mode is enabled, show queue and cancel messages.
c2m-debug-stuck=When debug mode is enabled, show stuck detection and recovery messages.
c2m-debug-vehicle=When debug mode is enabled, show vehicle steering and recovery messages.
c2m-character-margin=Enlarges the character bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 0.45]
c2m-update-interval=Ticks between movement updates. Lower is smoother but uses more UPS. [Default: 1]
c2m-character-proximity-threshold=How close the character needs to be to a waypoint to consider it reached. [Default: 1.5]
c2m-vehicle-proximity-threshold=How close a vehicle needs to be to a waypoint to consider it reached. [Default: 6.0]
c2m-stuck-threshold=Ticks to wait before considering the character stuck and repathing. [Default: 30]
c2m-vehicle-path-margin=Enlarges the vehicle bounding box in order to avoid collisions. Very large values can make the mod unable to function properly. [Default: 2.0]
c2m-vehicle-prefer-straight-paths=Ask Factorio's pathfinder to prefer straighter paths for vehicles. This can produce smoother driving routes, but may make paths slower to compute. [Default: false]
c2m-cancel-on-manual-move=Stop an in-progress auto-walk the moment you press a movement key, instead of fighting you for control. [Default: true]
c2m-routing-strategy=How routes are chosen. "naive" walks the raw path, which is the old behaviour. "belt-aware" accounts for transport belts pushing you around — stepping off a belt that opposes your travel, and riding one that helps. "dual-phase" starts walking on the belt-aware route immediately, then swaps in a better background-computed route if it is still faster from where you have got to. Switch live with CONTROL + SHIFT + R. [Default: belt-aware]
c2m-belt-ride=When belt-aware routing is on, allow small detours onto belts that move in your direction of travel if they are genuinely faster. Turn off to only avoid belts, never use them. [Default: true]
c2m-squeeze-margin=Bounding box margin used when a normal route fails and the character is wedged among buildings. 0 = automatic (tighter when Squeak Through is installed). [Default: 0 (auto)]
c2m-never-give-up=When a route fails, retry with progressively looser constraints (tighter margin, nudged start, nearest reachable point to the goal) instead of immediately refusing to move. [Default: true]

